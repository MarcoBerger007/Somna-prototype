<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Luna – sleep app prototype</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box;margin:0}
body{background:#121218;margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;}
#ph{width:100%;max-width:390px;height:100vh;background:#0c0c26;position:relative;margin:auto;overflow:hidden;}
.scr{position:absolute;inset:0;display:flex;flex-direction:column;background:#0c0c26;color:#f0eefc}
.enR{animation:inR .35s cubic-bezier(.2,.8,.2,1)}.enL{animation:inL .35s cubic-bezier(.2,.8,.2,1)}

.sb{height:46px;padding:18px 26px 0;display:flex;justify-content:space-between;font-size:13px;font-weight:600;flex:none}
.body{flex:1;overflow:auto;padding:6px 20px 26px;scrollbar-width:none}.body::-webkit-scrollbar{display:none}
h1{font-size:26px;font-weight:700;letter-spacing:-.5px;margin:10px 0 6px;line-height:1.15}
h2{font-size:17px;margin:20px 0 6px}
.s,small{color:#9a98c0;font-size:13px;line-height:1.4}.s{display:block}small{display:block;font-size:11.5px;margin-top:4px}
.k{font-size:10.5px;letter-spacing:.4px;text-transform:uppercase;color:#b7a3f8;margin-top:14px;font-weight:600}
.card{background:#1b1b3d;border-radius:18px;padding:16px;margin:12px 0}.c2{background:#26264f}

.b{display:block;width:100%;border:0;border-radius:12px;padding:13px;font:600 14px Inter,system-ui;cursor:pointer;margin:8px 0;background:#26264f;color:#b7a3f8;transition:.15s}
.b.p{background:#b7a3f8;color:#14123a}.b:hover{filter:brightness(1.15);transform:translateY(-1px)}.b:active{transform:scale(.97)}
.bar{height:6px;background:#2b2b55;border-radius:9px;overflow:hidden;margin:9px 0}
.bar i{display:block;height:100%;background:#b7a3f8;border-radius:9px;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.lk{color:#b7a3f8;font-size:13px;cursor:pointer;font-weight:500}.lk:hover{text-decoration:underline}
.mint{color:#8be0c0}.y{color:#f5d06b}.c{text-align:center}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}.g{display:grid;gap:8px}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:1fr 1fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid #b7a3f8;flex:none;display:grid;place-items:center;font-size:13px;color:#0c0c26;transition:.2s}.chk.on{background:#8be0c0;border-color:#8be0c0}
.item{display:flex;gap:12px;align-items:center;padding:13px 2px;border-bottom:1px solid #26264f;cursor:pointer;font-size:14px}.item:hover{background:#ffffff08}
.nav{display:flex;justify-content:space-around;padding:12px 0 24px;border-top:1px solid #1b1b3d;font-size:12px;color:#9a98c0;flex:none}
.nav span{cursor:pointer;padding:4px 8px}.nav .a{color:#b7a3f8;font-weight:700;border-bottom:2px solid #b7a3f8}
.toast{position:absolute;top:48px;left:14px;right:14px;background:#2d2a66;border:1px solid #b7a3f8;border-radius:16px;padding:12px 14px;font-size:13px;z-index:20;transform:translateY(-130px);transition:.45s cubic-bezier(.2,.8,.2,1);display:flex;gap:10px;align-items:center;cursor:pointer}.toast.show{transform:none}
.luna{animation:bob 3s ease-in-out infinite;flex:none}@keyframes bob{50%{transform:translateY(-4px)}}
.luna.pop{animation:pop .8s}@keyframes pop{30%{transform:scale(1.28) rotate(-6deg);filter:drop-shadow(0 0 16px #b7a3f8)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}@keyframes blink{92%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.seg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.seg b{padding:12px;text-align:center;border-radius:10px;background:#26264f;font-size:13px;cursor:pointer;color:#b7a3f8}.seg b.on{background:#b7a3f8;color:#14123a}
.pill{display:inline-block;padding:9px 14px;border-radius:10px;background:#26264f;color:#b7a3f8;font-size:13px;font-weight:600;cursor:pointer}.pill.on{background:#b7a3f8;color:#14123a}
input,textarea{width:100%;background:#12122e;border:1px solid #3a3a70;border-radius:12px;padding:13px;color:#f0eefc;font:14px Inter,system-ui;outline:0}input:focus,textarea:focus{border-color:#b7a3f8}
textarea{min-height:150px;resize:none;line-height:1.6}
.day{width:34px;height:34px;border-radius:50%;border:1.5px solid #b7a3f8;display:grid;place-items:center;font-size:12px;color:#b7a3f8;cursor:pointer}.day.on{background:#2d2a66}
.circ{width:150px;height:150px;border-radius:50%;border:2px solid #4a3f94;margin:16px auto;display:grid;place-items:center;background:#1e1b4a;transition:transform 4s ease-in-out}.circ.in{transform:scale(1.3);box-shadow:0 0 40px #b7a3f866}
.night{position:absolute;inset:0;background:#05051a;z-index:30;display:grid;place-content:center;text-align:center;color:#f0eefc;opacity:0;pointer-events:none;transition:opacity .6s;font-size:15px;line-height:2}.night.on{opacity:1;pointer-events:auto}
.cf{position:absolute;top:-20px;font-size:20px;z-index:25;animation:fall 2.4s ease-in forwards;pointer-events:none}@keyframes fall{to{transform:translateY(900px) rotate(540deg);opacity:0}}
.bars{display:flex;gap:8px;align-items:flex-end;height:130px;margin-top:14px}.bars div{flex:1;background:#b7a3f8;border-radius:6px;transition:height 1s}
.bars span{display:block;text-align:center;font-size:10px;color:#9a98c0;margin-top:6px}
@media (max-width: 500px){body{background:#0c0c26;overflow:auto;}#ph{width:100vw;height:100vh;max-width:none;border-radius:0;box-shadow:none;margin:0;}}
</style></head><body><div id="ph"><div class="toast" id="toast"></div><div class="night" id="night">🌙<br>Phone away. Sleep well, Lineah.<br><small>Fast-forwarding to morning…</small></div></div>
<script>
const $=s=>document.querySelector(s),ph=$('#ph');
const st={xp:320,lv:4,coins:120,streak:8,club:8,cheer:4,q:[
{n:'30 minutes of physical activity',d:1},{n:'No naps longer than 30 minutes',d:1},{n:'15 minutes outside in daylight',d:1},{n:'Enough water during the day',d:1},
{n:'No caffeine after 16:00',d:0},{n:'Start winding down 30 minutes before bed',d:0}],
cl:[['Brushed teeth',1],['Put charger away from bed',1],['Filled water bottle',1],["Set tomorrow's alarm",0],['Put phone on silent',0],['Turned off bright lights',0],['Packed school bag for tomorrow',0]],
bed:1350,wake:405,fell:1350,woke:405,g:[1,1,1],diff:'Medium',sel:2,rep:4,days:[1,1,1,1,1,0,0],rem:1,own:'Leave my phone on my desk by 22:15.',use:0,
owned:{scarf:1},eq:'scarf',pv:null,prompt:0,j:'',br:0,mus:0,shared:0,sent:0,done:0,morning:0};
const max=()=>st.lv==4?500:600,nDone=()=>st.q.filter(q=>q.d).length;
const T=m=>{m=(m+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0')};
const dur=(a,b)=>{const d=(b-a+1440)%1440;return Math.floor(d/60)+'h '+d%60+'m'};
const hat=()=>st.eq=='scarf'?'':st.eq;
function L(s,h){h=st.pv||h||hat();const has=k=>h.includes(k),R='stroke-linejoin="round" stroke-linecap="round"',G='fill="url(#lg)" stroke="url(#lg)"';return `<svg class="luna" width="${s}" height="${s}" viewBox="0 0 100 100"><defs><linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="94"><stop offset="0" stop-color="#bca9f8"/><stop offset=".55" stop-color="#9d86e3"/><stop offset="1" stop-color="#8268c6"/></linearGradient></defs><ellipse cx="50" cy="94" rx="30" ry="3" fill="#0000002e"/>${has('cape')?`<path d="M18 62Q14 84 9 92Q50 100 91 92Q86 84 82 62Z" fill="#3b3270" stroke="#3b3270" stroke-width="3" ${R}/><circle cx="21" cy="76" r="1.8" fill="#e2dafa"/><circle cx="79" cy="80" r="1.8" fill="#e2dafa"/><circle cx="27" cy="86" r="1" fill="#e2dafa"/>`:''}<path d="M29 24L31 15L45 27Z" ${G} stroke-width="8" ${R}/><path d="M71 24L69 15L55 27Z" ${G} stroke-width="8" ${R}/><ellipse cx="20" cy="68" rx="8.500" ry="16" transform="rotate(8 20 68)" fill="#7a60b6"/><ellipse cx="80" cy="68" rx="8.500" ry="16" transform="rotate(-8 80 68)" fill="#8c74c6"/><ellipse cx="50" cy="69" rx="28" ry="23" fill="url(#lg)"/><ellipse cx="50" cy="44" rx="31" ry="28" fill="url(#lg)"/>${has('cape')?'<ellipse cx="50" cy="80" rx="15" ry="11" fill="#d3c7f3"/>':''}<ellipse cx="40" cy="92" rx="6.500" ry="3" fill="#fcd08a"/><ellipse cx="60" cy="92" rx="6.500" ry="3" fill="#fcd08a"/><path d="M50 65Q23 57 25 41Q27 28 40 29Q47 29 50 36Q53 29 60 29Q73 28 75 41Q77 57 50 65Z" fill="${has('cap')?'#f4eefc':'#e8defa'}" stroke="${has('cap')?'#f4eefc':'#e8defa'}" stroke-width="2" ${R}/><g class="eye"><ellipse cx="38" cy="45" rx="7.500" ry="9" fill="#2d2645"/><ellipse cx="62" cy="45" rx="7.500" ry="9" fill="#2d2645"/><circle cx="36.500" cy="41.500" r="2.600" fill="#fff"/><circle cx="60.500" cy="41.500" r="2.600" fill="#fff"/></g><ellipse cx="29.500" cy="55" rx="5" ry="3" fill="#c9a8dc"/><ellipse cx="70.500" cy="55" rx="5" ry="3" fill="#c9a8dc"/><path d="M47 52Q50 50.500 53 52L50 58Z" fill="#fcd08a" stroke="#fcd08a" stroke-width="2" ${R}/><g transform="translate(0 ${has('bare')?0:9})"><path d="M43 71l2 3.500 2-3.500M53 71l2 3.500 2-3.500" stroke="#a58fd6" stroke-width="1.600" fill="none" ${R}/></g>${has('bare')?'':`<path d="M67 79L75 77L77 89L72 86L69 90Z" fill="#8cc6b5" stroke="#8cc6b5" stroke-width="3" ${R}/><path d="M24 68Q50 80 76 68L75 76Q50 87 25 76Z" fill="#b3e6d4" stroke="#b3e6d4" stroke-width="3" ${R}/><path d="M50 73l1.300 2.800 3 .4-2.200 2 .6 3-2.700-1.500-2.700 1.500.6-3-2.200-2 3-.4z" fill="#fcd08a"/>`}${has('cap')?`<path d="M28 28Q28 9 50 9Q72 9 72 28Q50 22 28 28Z" fill="#cfc3f5" stroke="#cfc3f5" stroke-width="3" ${R}/><path d="M27 26Q50 18 73 27L72 31Q50 24 28 30Z" fill="#e3dbfa" stroke="#e3dbfa" stroke-width="3" ${R}/><circle cx="73" cy="22" r="5.500" fill="#b3e6d4"/><circle cx="77" cy="17" r="3.500" fill="#b3e6d4"/>`:''}${has('pin')?'<path d="M70 63l2 5 5 .5-4 3 1.500 5-4.500-3-4.500 3 1.500-5-4-3 5-.5z" fill="#f5d06b" stroke="#f5d06b" stroke-width="1" '+R+'/>':''}</svg>`}
let cur='home',hist=[],prev={},tt;
function bar(k,p){return `<div class="bar"><i data-k="${k}" data-w="${p}" style="width:${prev[k]??0}%"></i></div>`}
const chk=on=>`<span class="chk ${on?'on':''}">${on?'✓':''}</span>`;
const H=(b,t,s,k,r='')=>`<div class="row sp" style="margin-top:4px"><span class="lk" data-back>‹ ${b}</span>${r}</div>${k?`<div class="k">${k}</div>`:''}<h1>${t}</h1>${s?`<span class="s">${s}</span>`:''}`;
const lunaCard=(q,sub,sz=70)=>`<div class="card row" style="gap:14px">${L(sz)}<div><b>${q}</b><span class="s" style="margin-top:4px">${sub}</span></div></div>`;
const bt=(l,a,c='')=>`<button class="b ${c}" ${a}>${l}</button>`;
const nav=a=>`<div class="nav">${[['Home','home'],['Sleep','plan'],['Stats','trends'],['Friends','friends']].map(([n,i])=>`<span class="${n==a?'a':''}" data-go="${i}">${n}</span>`).join('')}</div>`;
const msgs=['"One small step is enough for tonight."','"No perfect nights needed."','"I love how you keep showing up."','"Small steps are my favorite."'];let mi=0;
const goalsT=[['Phone away at 22:20',30],['8h 15m estimated sleep',40],['No TikTok after bedtime',30]];
const S={
home:{t:'21:41',nav:'Home',h:()=>`<h1 style="margin-top:14px">Good ${st.morning?'morning':'evening'}, Lineah</h1><span class="s">A little less scrolling. A softer night.</span>
<div class="card row" style="gap:14px;margin-top:22px;cursor:pointer" data-do="pet"><div style="background:#26264f;border-radius:50%;padding:4px">${L(76)}</div><div><b>Luna is on your side.</b><span class="s" id="lm">${msgs[mi]}</span><span class="lk" data-go="luna">Meet Luna →</span></div></div>
<div class="card"><div class="row sp"><b style="font-size:17px">Daily Sleep Quests</b><span class="mint" style="font-size:13px">${nDone()} of 6</span></div><span class="s" style="margin-top:6px">${6-nDone()} small quests left today</span>${bar('hq',nDone()/6*100)}${bt('View today’s quests →','data-go="quests"')}</div>
${bt('Start Wind-down','data-go="wind"','p')}<span class="s c">22:00 wind-down · 22:30 bedtime</span>
<div class="card"><div class="row sp"><b>Your progress</b><span class="lk" data-go="guide">ⓘ How Progress Works</span></div><div class="g g4" style="margin-top:14px;font-size:14px"><div><b>${st.lv}</b><small>Level</small></div><div><b class="lk" style="color:#b7a3f8">${st.xp} / ${max()}</b><small>XP</small></div><div><b class="y">${st.coins}</b><small>Coins</small></div><div><b class="mint">${st.streak} nights</b><small>Streak</small></div></div>${bar('hx',st.xp/max()*100)}</div>
<div class="card" data-go="friends" style="cursor:pointer"><b>Dreaming together</b><span class="s">${st.club} of 12 wind-downs with Emma &amp; Noah this week.</span>${bar('hf',st.club/12*100)}</div>`},
quests:{t:'21:41',h:()=>{const p=st.q.map((q,i)=>[q,i]).filter(x=>!x[0].d),c=st.q.filter(q=>q.d);return H('Home','Daily Sleep Quests','A few small wins. Choose what fits today.',0,'<span class="lk" data-go="guide">How Progress Works</span>')+
`<div class="card"><b style="font-size:17px">${nDone()} of 6 quests completed</b>${bar('qb',nDone()/6*100)}<small>${nDone()*20} XP earned today · Already in your total</small></div>
<div class="card"><div class="k" style="margin:0">For your goal</div><b style="font-size:17px">Less late-night scrolling</b><span class="lk" style="display:block;text-align:center;margin-top:14px" data-go="personalize" data-r="${p[0]?p[0][1]:0}">Personalize quests →</span></div>
<h2>${p.length?p.length+' left for today':'All done for today 🌙'}</h2>`+p.map(([q,i])=>`<div class="card"><b style="font-size:16px">${q.n}</b><small class="lk">Pending · Medium · +20 XP</small><div class="row sp" style="margin-top:12px"><span class="lk" data-do="q" data-a="${i}" style="color:#8be0c0">○ Mark done</span><span class="lk" data-go="personalize" data-r="${i}">Replace</span></div></div>`).join('')+
`<div class="card"><b class="mint">Completed · ${c.length}</b>`+st.q.map((q,i)=>q.d?`<div class="item" data-do="q" data-a="${i}" style="padding:9px 0;border:0;color:#cfcbee;font-size:13px">✓ ${q.n}</div>`:'').join('')+`</div><small style="margin:14px 0">You confirm your own progress. Tap a completed quest to undo it.</small>`+bt('Start wind-down at 22:00','data-go="wind"','p')}},
personalize:{t:'21:41',h:()=>{const o=[['Turn on Do Not Disturb before bed.','Silence notifications before your 22:30 bedtime.'],['No TikTok after 22:00.','An earlier stopping point for your 22:30 bedtime.'],['Stay off social media 30 minutes before sleep.','Your 22:00–22:30 social break.'],['Put the phone away earlier than yesterday.','Yesterday 22:20 → Try 22:15 tonight.'],['Avoid doom-scrolling before bedtime.','Leave the feed when your wind-down reminder starts.']];
return H('Daily quests','Make quests fit you.','Optional swap. Keep your completed quests and XP.')+`<div class="card"><div class="k" style="margin:0">Your sleep goal</div><b style="font-size:17px">Less late-night scrolling</b></div><h2>Choose your difficulty</h2><div class="seg">${['Easy','Medium','Hard'].map(d=>`<b class="${st.diff==d?'on':''}" data-do="diff" data-a="${d}">${d}</b>`).join('')}</div><small style="margin:10px 0">Same 20 XP at every difficulty. Choose the effort that fits you, not the biggest reward.</small>
<div class="card c2"><b style="font-size:13px">Replacing: ${st.q[st.rep].n}</b><small>Nothing changes until you confirm below.</small></div><h2>Recommended phone quests</h2>`+o.map((x,i)=>`<div class="card ${st.sel==i&&!st.use?'sel':''}" style="cursor:pointer" data-do="pick" data-a="${i}"><b style="font-size:14px">${st.sel==i&&!st.use?'✓':'○'} ${x[0]}</b><small>${x[1]}</small><small class="lk">${st.sel==i&&!st.use?'Selected · ':''}${st.diff} · +20 XP</small></div>`).join('')+
`<div class="card"><b style="font-size:16px">Or make it personal</b><small style="margin-bottom:10px">Your quest · Draft</small><input id="own" value="${st.own}"><small class="lk">${st.diff} · +20 XP · You confirm completion</small>${bt('Use my own quest instead','data-do="useown"')}</div>`+bt('Replace with selected quest','data-do="rep"','p')+bt('Keep current quest','data-back')+`<small>Only the pending quest will change. Your completed quests and earned XP stay.</small>`}},
wind:{t:'22:05',h:()=>H('Home','Settle in with Luna.','Your routine, at your pace.')+lunaCard('“No perfect nights needed.”','Start with one small thing. Started 22:00 · +20 XP earned',80)+
`<div class="card"><b style="font-size:17px">Bed ${T(st.bed)} · Wake ${T(st.wake)}</b><small class="lk">${dur(st.bed,st.wake)} planned · <span data-go="plan" style="cursor:pointer">Edit sleep plan ›</span></small></div>
<div class="card"><b style="font-size:17px">Bedtime checklist</b><small>${st.cl.filter(x=>x[1]).length} of ${st.cl.length} done · Few little things left</small>${bar('wb',st.cl.filter(x=>x[1]).length/st.cl.length*100)}${bt('Continue checklist','data-go="checklist"','p')}</div>
<h2>A little calm · Optional</h2><div class="g g2"><div class="card"><b>♫ Relaxing music</b><small>Soft piano · 15 min</small>${bt('Choose music','data-go="calm"')}</div><div class="card"><b>Guided breathing</b><small>An easy 2-minute reset</small>${bt('Breathe with Luna','data-go="calm"')}</div></div>
${bt('I’m putting my phone away','data-do="phone"')}<small class="c">Skip anything that doesn’t help tonight. Confirm your progress in the morning; we don’t track your social activity.</small>`},
checklist:{t:'22:05',h:()=>{const n=st.cl.filter(x=>x[1]).length;return H('Home','A softer landing.','Your bedtime checklist, all in one place. No need to keep it all in your head.','Wind-down · Bedtime 22:30')+lunaCard('Luna · Moon keeper','“One less thing to remember. A little more room to rest.”',64)+
`<div class="row sp" style="margin-top:18px"><b style="font-size:19px">Tonight’s little things</b><span class="lk">☰ Customize</span></div><div class="row sp" style="margin-top:12px;font-size:13px"><b>${n} of ${st.cl.length} completed</b><span class="s">${st.cl.length-n} remaining · Go at your pace</span></div>${bar('cb',n/st.cl.length*100)}<div class="card c2 mint" style="padding:9px 12px;font-size:12.5px">✦ Nice, one less thing to think about</div>
<div class="card" style="padding:4px 14px">`+st.cl.map((x,i)=>`<div class="item" data-do="ci" data-a="${i}">${chk(x[1])}<div style="flex:1">${x[0]}<small style="margin:0">${x[1]?'Completed':'Remaining'}</small></div><span class="s">⋮⋮</span></div>`).join('')+`</div>
<div class="row"><input id="add" placeholder="Add your own item"><button class="b" style="width:90px;margin:0" data-do="add">+ Add</button></div><small style="margin:10px 0">Customize to edit or remove items. No extra XP for ticking this list.</small>
<div class="card"><small style="margin:0">Repeat this routine</small><b style="font-size:17px">School nights</b><div class="row sp" style="margin:14px 0">${'MTWTFSS'.split('').map((d,i)=>`<span class="day ${st.days[i]?'on':''}" data-do="day" data-a="${i}">${d}</span>`).join('')}</div>${bt('🔖 Save recurring routine','data-do="rec"')}</div>`+bt('✎ Brain dump · Optional','data-go="journal"')+bt('☾ Ready to put my phone away','data-do="phone"','p')+`<small class="c">Skip the brain dump if you’re ready to rest.</small><p class="c lk" style="margin-top:12px" data-go="home">Skip checklist · That’s okay</p>`}},
journal:{t:'21:41',h:()=>{const P=['What went well today?','What is one thing you’re proud of today?','Free-write · No prompt needed'];return H('Bedtime prep','Let the day settle.','A brain dump, a small win, or a few messy thoughts. There’s no right way to write.','Tonight · Before bed')+lunaCard('A little space for you.','“A sentence is enough. And skipping is always okay.”',64)+

function build(){const s=S[cur];return `<div class="sb"><span>${s.t}</span><span>▂▄▆ ◠ ▭</span></div><div class="body">${s.h()}</div>${s.nav?nav(s.nav):''}`}
function after(){document.querySelectorAll('[data-k]').forEach(e=>requestAnimationFrame(()=>requestAnimationFrame(()=>{e.style.width=e.dataset.w+'%';prev[e.dataset.k]=+e.dataset.w})))}
function render(){const e=$('.scr'),b=e.querySelector('.body'),y=b?b.scrollTop:0;e.innerHTML=build();e.querySelector('.body').scrollTop=y;after()}
function go(id,back){const o=$('.scr'),n=document.createElement('div');if(!back){if(['home','plan','trends','friends'].includes(id))hist=[];else hist.push(cur)}cur=id;n.className='scr '+(back?'enL':'enR');n.innerHTML=build();ph.appendChild(n);after();if(o)setTimeout(()=>o.remove(),380);if(id=='goals'&&st.done&&!st._c)0}
function toast(m,i='✨'){const t=$('#toast');t.innerHTML=`<span style="font-size:20px">${i}</span><span>${m}</span>`;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),3200)}
function bump(){document.querySelectorAll('.luna').forEach(l=>{l.classList.remove('pop');void l.getBoundingClientRect();l.classList.add('pop')})}
function party(){for(let i=0;i<26;i++){const c=document.createElement('span');c.className='cf';c.textContent=['✨','⭐','🌙','💜'][i%4];c.style.left=Math.random()*95+'%';c.style.animationDelay=Math.random()*.6+'s';ph.appendChild(c);setTimeout(()=>c.remove(),3200)}}
function xp(n){st.xp=Math.max(0,st.xp+n);if(st.xp>=max()){st.xp-=max();st.lv++;st.coins+=50;party();toast('Achievement unlocked: Level '+st.lv+'! +50 coins','🏆')}else if(n>0)toast('+'+n+' XP · Luna is happy','⭐');render();if(n>0)bump()}
